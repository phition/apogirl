<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이벤트 분기 지도</title>
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #24221e; --dim: #6f6a61; --line: #ddd7cc; --grid: #ebe6dc; --lane-a: #fbfaf6; --lane-b: #f3f0e8;
  --accent: #9c6b2f; --sel: #c0392b;
  --e-flag: #5b7fa6; --e-block: #c0392b; --e-then: #d4832c; --e-npc: #3f8f5a; --e-clue: #8a5bb0; --e-scene: #2f9a8f; --e-act: #8c8577;
  --n-event: #ffffff; --n-random: #f4f1ea; --n-enc: #e8f4ec; --n-act: #eef0f3; --n-end: #f1eaf7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #1f2125; --ink: #ece8df; --dim: #9b968c; --line: #34373d; --grid: #26292e; --lane-a: #1b1d21; --lane-b: #202227;
    --accent: #d9a35c; --sel: #ff6b5a;
    --n-event: #2a2d33; --n-random: #24262b; --n-enc: #1f3328; --n-act: #2a2e35; --n-end: #2e2638;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --panel: #1f2125; --ink: #ece8df; --dim: #9b968c; --line: #34373d; --grid: #26292e; --lane-a: #1b1d21; --lane-b: #202227;
  --accent: #d9a35c; --sel: #ff6b5a;
  --n-event: #2a2d33; --n-random: #24262b; --n-enc: #1f3328; --n-act: #2a2e35; --n-end: #2e2638;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 13px/1.45 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
header .stats { color: var(--dim); }
header input[type=search] { width: 220px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; user-select: none; background: var(--bg); }
.chip.off { opacity: .4; }
.chip i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
button { padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
button:hover, .chip:hover { border-color: var(--accent); }
#wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
#main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; position: relative; overflow: hidden; cursor: grab; }
#stage.drag { cursor: grabbing; }
#stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#side { width: 380px; border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px 14px; }
#side h2 { font-size: 15px; margin: 0 0 6px; word-break: break-all; }
#side h3 { font-size: 12px; color: var(--accent); margin: 14px 0 4px; letter-spacing: .02em; }
#side .muted { color: var(--dim); }
#side ul { margin: 0; padding-left: 16px; }
#side li { margin: 2px 0; }
.choice { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
.choice b { color: var(--accent); }
.flag { display: inline-block; font-family: Consolas, monospace; font-size: 11px; padding: 0 5px; margin: 1px 2px; border-radius: 4px; background: var(--grid); }
.link { color: var(--e-flag); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; }
.quote { border-left: 3px solid var(--line); padding-left: 8px; color: var(--dim); margin: 4px 0; }
.badge { display: inline-block; padding: 0 6px; border-radius: 8px; font-size: 11px; border: 1px solid var(--line); margin-right: 4px; }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 360px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; z-index: 5; }
.legend { color: var(--dim); font-size: 12px; }
@media (max-width: 760px) { #side { position: absolute; right: 0; top: 0; bottom: 0; width: 88%; display: none; } #side.open { display: block; } }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>마지막 학기 · 이벤트 분기 지도</h1>
    <span class="stats" id="stats"></span>
    <input type="search" id="q" placeholder="이벤트 ID · 플래그 · 대사 검색 (Enter: 다음)">
    <span id="edgeChips"></span>
    <button id="fit">전체 보기</button>
    <button id="pathOnly" title="고른 노드와 이어진 것만 진하게">경로만: 끔</button>
    <button id="checks">점검</button>
    <button id="theme">밝기</button>
  </header>
  <div style="padding:4px 14px; border-bottom:1px solid var(--line); background:var(--panel)" id="laneChips"></div>
  <div id="main">
    <div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <aside id="side"><p class="muted">노드를 누르면 조건·선택지·대사와 앞뒤로 이어진 이벤트가 여기에 나옵니다.<br>휠: 확대/축소 · 끌기: 이동 · 빈 곳 클릭: 선택 해제</p>
      <p class="legend">노드: 흰색 = 이야기 이벤트, 연한 회색 = 무작위·날씨, 초록 점선 = 탐험 조우, 회색 = 행동, 보라 = 엔딩.<br>
      가로 위치 = 처음 뜰 수 있는 주(조건의 최소 주와, 필요한 플래그를 처음 켤 수 있는 주 중 늦은 쪽).</p></aside>
  </div>
</div>
<div id="tip"></div>
<script>
const DATA = /*__DATA__*/null;
(function () {
  const W = 150, NW = 136, NH = 30, ROW = 38, PAD = 10, LEFT = 120, TOP = 34;
  const EDGE = {
    flag: { name: '플래그', color: 'var(--e-flag)' }, block: { name: '막음', color: 'var(--e-block)' }, then: { name: '연쇄', color: 'var(--e-then)' },
    npc: { name: '동료', color: 'var(--e-npc)' }, clue: { name: '단서', color: 'var(--e-clue)' }, scene: { name: '그 자리 컷', color: 'var(--e-scene)' },
    act: { name: '행동', color: 'var(--e-act)' },
  };
  const edgeOn = { flag: true, block: false, then: true, npc: true, clue: true, scene: true, act: true };
  const laneOn = {}; DATA.lanes.forEach(l => laneOn[l.key] = true);
  const byId = {}; DATA.nodes.forEach(n => byId[n.id] = n);
  const out = {}, inc = {};
  DATA.edges.forEach(e => { (out[e.from] = out[e.from] || []).push(e); (inc[e.to] = inc[e.to] || []).push(e); });
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('svg');
  const el = (tag, attrs, parent) => { const x = document.createElementNS(svgNS, tag); for (const k in attrs) x.setAttribute(k, attrs[k]); if (parent) parent.appendChild(x); return x; };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const short = id => id.replace(/^EVT_/, '').replace(/^ENDING_/, '엔딩 ').replace(/^ENC_/, '조우 ').replace(/^ACT_/, '행동 ').replace(/^SEARCH_SEARCHED_/, '수색 ');

  document.getElementById('stats').textContent =
    `이벤트 ${DATA.stats.events} · 조우 ${DATA.stats.encounters} · 행동 ${DATA.stats.actions} · 엔딩 ${DATA.stats.endings} · 연결 ${DATA.stats.edges}`;

  // ── 배치: 줄마다 같은 주에 겹치는 노드는 아래 칸으로 ──
  let laneY = {}, totalH = 0;
  function layout() {
    let y = TOP;
    DATA.lanes.forEach((lane, i) => {
      if (!laneOn[lane.key]) { laneY[lane.key] = null; return; }
      const items = DATA.nodes.filter(n => n.lane === lane.key).sort((a, b) => a.x - b.x || a.id.localeCompare(b.id));
      const rows = [];
      items.forEach(n => {
        let r = rows.findIndex(last => last < n.x);
        if (r < 0) { r = rows.length; rows.push(0); }
        rows[r] = n.x; n.row = r;
      });
      const h = Math.max(1, rows.length) * ROW + PAD * 2;
      laneY[lane.key] = { y, h, i };
      items.forEach(n => { n.px = LEFT + (n.x - 1) * W + 7; n.py = y + PAD + n.row * ROW; });
      y += h;
    });
    totalH = y;
  }

  // ── 그리기 ──
  const view = { tx: 0, ty: 0, k: 1 };
  let gWorld, gEdges, gNodes, gRuler, gLanes, selected = null, pathOnly = false, related = null;
  const nodeEls = {}, edgeEls = [];
  function draw() {
    svg.innerHTML = '';
    layout();
    gWorld = el('g', {}, svg);
    const bg = el('g', {}, gWorld);
    DATA.lanes.forEach(lane => {
      const L = laneY[lane.key]; if (!L) return;
      el('rect', { x: LEFT, y: L.y, width: 52 * W, height: L.h, fill: L.i % 2 ? 'var(--lane-b)' : 'var(--lane-a)' }, bg);
    });
    for (let w = 1; w <= 53; w++) el('line', { x1: LEFT + (w - 1) * W, y1: TOP, x2: LEFT + (w - 1) * W, y2: totalH, stroke: 'var(--grid)', 'stroke-width': w % 13 === 1 ? 2 : 1 }, bg);
    gEdges = el('g', {}, gWorld);
    gNodes = el('g', {}, gWorld);
    edgeEls.length = 0;
    DATA.edges.forEach(e => {
      const a = byId[e.from], b = byId[e.to];
      if (!edgeOn[e.kind] || !laneOn[a.lane] || !laneOn[b.lane]) return;
      const x1 = a.px + NW, y1 = a.py + NH / 2, x2 = b.px, y2 = b.py + NH / 2;
      let d;
      if (x2 > x1 + 10) { const c = Math.max(30, (x2 - x1) * 0.45); d = `M${x1},${y1} C${x1 + c},${y1} ${x2 - c},${y2} ${x2},${y2}`; }
      else { const lift = 40 + Math.abs(y2 - y1) * 0.1; d = `M${x1},${y1} C${x1 + 60},${y1 - lift} ${x2 - 60},${y2 - lift} ${x2},${y2}`; }
      const p = el('path', { d, fill: 'none', stroke: EDGE[e.kind].color, 'stroke-width': 1.4, 'stroke-dasharray': e.kind === 'block' ? '4 3' : '' }, gEdges);
      p._e = e; edgeEls.push(p);
    });
    DATA.nodes.forEach(n => {
      if (!laneOn[n.lane]) return;
      const g = el('g', { transform: `translate(${n.px},${n.py})`, style: 'cursor:pointer' }, gNodes);
      const fill = n.kind === 'encounter' ? 'var(--n-enc)' : (n.kind === 'action' || n.kind === 'search') ? 'var(--n-act)' : n.kind === 'ending' ? 'var(--n-end)'
        : (n.meta['종류'] === 'Random' || n.lane === 'RND') ? 'var(--n-random)' : 'var(--n-event)';
      const r = el('rect', { width: NW, height: NH, rx: 6, fill, stroke: n.kind === 'encounter' ? 'var(--e-npc)' : 'var(--line)', 'stroke-width': 1.2,
        'stroke-dasharray': n.kind === 'encounter' ? '4 2' : '' }, g);
      const label = n.kind === 'ending' ? (n.meta['제목'] || short(n.id)) : short(n.id);
      const t = el('text', { x: 7, y: 19, 'font-size': 11, fill: 'var(--ink)' }, g);
      t.textContent = label.length > 19 ? label.slice(0, 18) + '…' : label;
      g._n = n; g._r = r; nodeEls[n.id] = g;
      g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
      g.addEventListener('mousemove', ev => tip(ev, n));
      g.addEventListener('mouseleave', () => tipEl.style.display = 'none');
    });
    gLanes = el('g', {}, svg);
    gRuler = el('g', {}, svg);
    apply();
    restyle();
  }

  function apply() {
    gWorld.setAttribute('transform', `translate(${view.tx},${view.ty}) scale(${view.k})`);
    gRuler.innerHTML = ''; gLanes.innerHTML = '';
    const W0 = svg.clientWidth;
    el('rect', { x: 0, y: 0, width: W0, height: 26, fill: 'var(--panel)' }, gRuler);
    for (let w = 1; w <= 52; w++) {
      const sx = view.tx + (LEFT + (w - 1) * W + W / 2) * view.k;
      if (sx < LEFT - 40 || sx > W0 + 40) continue;
      if (view.k < 0.35 && w % 4 !== 1) continue;
      const t = el('text', { x: sx, y: 17, 'text-anchor': 'middle', 'font-size': 11, fill: w % 13 === 1 ? 'var(--accent)' : 'var(--dim)' }, gRuler);
      t.textContent = w + '주';
    }
    el('rect', { x: 0, y: 26, width: LEFT - 6, height: svg.clientHeight, fill: 'var(--panel)' }, gLanes);
    DATA.lanes.forEach(lane => {
      const L = laneY[lane.key]; if (!L) return;
      const sy = view.ty + (L.y + Math.min(L.h, 60) / 2) * view.k;
      if (sy < 30 || sy > svg.clientHeight) return;
      const t = el('text', { x: 10, y: sy + 4, 'font-size': 12, 'font-weight': 600, fill: 'var(--ink)' }, gLanes);
      t.textContent = lane.name;
    });
  }

  // ── 고르기·경로 강조 ──
  function reach(start, dir) {
    const seen = new Set([start]), stack = [start];
    while (stack.length) {
      const id = stack.pop();
      ((dir === 'down' ? out : inc)[id] || []).forEach(e => {
        if (e.kind === 'block' || (e.kind === 'act' && dir === 'up') || !edgeOn[e.kind]) return;
        const nxt = dir === 'down' ? e.to : e.from;
        if (!seen.has(nxt)) { seen.add(nxt); stack.push(nxt); }
      });
    }
    return seen;
  }
  function restyle(matches) {
    const hasSel = !!selected;
    for (const id in nodeEls) {
      const g = nodeEls[id], on = !related || related.has(id);
      g.style.opacity = (hasSel && pathOnly && !on) ? 0.12 : (hasSel && !on ? 0.45 : 1);
      g._r.setAttribute('stroke', id === selected ? 'var(--sel)' : (matches && matches.has(id)) ? 'var(--accent)'
        : g._n.kind === 'encounter' ? 'var(--e-npc)' : 'var(--line)');
      g._r.setAttribute('stroke-width', id === selected || (matches && matches.has(id)) ? 3 : 1.2);
    }
    edgeEls.forEach(p => {
      const e = p._e, on = related && related.has(e.from) && related.has(e.to);
      p.setAttribute('stroke-opacity', hasSel ? (on ? 0.95 : (pathOnly ? 0.03 : 0.08)) : 0.28);
      p.setAttribute('stroke-width', on ? 2.2 : 1.3);
    });
  }
  function select(id, center) {
    selected = id;
    related = id ? new Set([...reach(id, 'down'), ...reach(id, 'up')]) : null;
    restyle();
    showSide(id);
    if (id && center) centerOn(byId[id]);
  }
  function centerOn(n) {
    if (!laneOn[n.lane]) { laneOn[n.lane] = true; buildLaneChips(); draw(); }
    view.k = Math.max(view.k, 0.8);
    view.tx = svg.clientWidth / 2 - (n.px + NW / 2) * view.k;
    view.ty = svg.clientHeight / 2 - (n.py + NH / 2) * view.k;
    apply();
  }

  // ── 옆 패널 ──
  const side = document.getElementById('side');
  const linkTo = id => byId[id] ? `<span class="link" data-go="${esc(id)}">${esc(byId[id].kind === 'ending' ? (byId[id].meta['제목'] || id) : short(id))}</span>` : `<span class="flag">${esc(id)}</span>`;
  const flags = list => (list || []).map(f => `<span class="flag">${esc(f)}</span>`).join(' ');
  function group(list, key) {
    const m = {}; list.forEach(e => { const k = `${EDGE[e.kind].name} · ${e.label}`; (m[k] = m[k] || []).push(e[key]); }); return m;
  }
  function showSide(id) {
    side.classList.toggle('open', !!id);
    if (!id) { side.innerHTML = '<p class="muted">노드를 누르면 자세한 내용이 나옵니다.</p>'; return; }
    const n = byId[id];
    const lane = DATA.lanes.find(l => l.key === n.lane);
    let h = `<h2>${esc(n.kind === 'ending' ? (n.meta['제목'] + ' · ' + n.id) : n.id)}</h2>`;
    h += `<div><span class="badge">${esc(lane ? lane.name : n.lane)}</span><span class="badge">${{ event: '이벤트', encounter: '탐험 조우', action: '행동', ending: '엔딩', search: '방 수색' }[n.kind]}</span>`
      + `<span class="badge">${n.x}주부터${n.weekMax ? ' · ' + n.weekMax + '주까지' : ''}</span></div>`;
    if (n.lines && n.lines.length) h += `<h3>대사 첫머리</h3>` + n.lines.slice(0, 5).map(l => `<div class="quote">${esc(l)}</div>`).join('');
    if (n.cond && n.cond.length) h += `<h3>조건</h3><ul>${n.cond.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`;
    if (n.onShow && n.onShow.length) h += `<h3>시작할 때</h3>${flags(n.onShow)}`;
    if (n.choices && n.choices.length) {
      h += `<h3>선택지</h3>` + n.choices.map(c => `<div class="choice"><b>${esc(c.id)}</b> ${esc(c.text)}`
        + (c.cond && c.cond.length ? `<div class="muted">조건: ${esc(c.cond.join(' / '))}</div>` : '')
        + (c.flags && c.flags.length ? `<div>켬: ${flags(c.flags)}</div>` : '')
        + (c.npc && c.npc.length ? `<div>동료: ${flags(c.npc)}</div>` : '')
        + (c.next ? `<div>이어서: ${linkTo(c.next)}</div>` : '') + `</div>`).join('');
    }
    const ins = group(inc[id] || [], 'from'), outs = group(out[id] || [], 'to');
    if (Object.keys(ins).length) h += `<h3>이것을 여는 것 (앞)</h3>` + Object.entries(ins).map(([k, v]) => `<div><span class="muted">${esc(k)}</span><br>${v.map(linkTo).join(', ')}</div>`).join('');
    if (Object.keys(outs).length) h += `<h3>이것이 여는 것 (뒤)</h3>` + Object.entries(outs).map(([k, v]) => `<div><span class="muted">${esc(k)}</span><br>${v.map(linkTo).join(', ')}</div>`).join('');
    const meta = Object.entries(n.meta || {}).filter(([, v]) => v !== '' && v !== undefined);
    if (meta.length) h += `<h3>정보</h3><ul>${meta.map(([k, v]) => `<li>${esc(k)}: ${esc(v)}</li>`).join('')}</ul>`;
    side.innerHTML = h;
  }
  side.addEventListener('click', ev => { const go = ev.target.closest('[data-go]'); if (go) select(go.dataset.go, true); });

  // ── 툴팁 ──
  const tipEl = document.getElementById('tip');
  function tip(ev, n) {
    tipEl.innerHTML = `<b>${esc(n.kind === 'ending' ? n.meta['제목'] : n.id)}</b><br>${esc((n.lines && n.lines[0]) || '')}`;
    tipEl.style.display = 'block';
    tipEl.style.left = Math.min(ev.clientX + 14, window.innerWidth - 380) + 'px';
    tipEl.style.top = (ev.clientY + 14) + 'px';
  }

  // ── 확대·이동 ──
  const stage = document.getElementById('stage');
  let drag = null;
  stage.addEventListener('wheel', ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const k = Math.min(2.5, Math.max(0.12, view.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    view.tx = mx - (mx - view.tx) * k / view.k; view.ty = my - (my - view.ty) * k / view.k; view.k = k; apply();
  }, { passive: false });
  stage.addEventListener('pointerdown', ev => { drag = { x: ev.clientX, y: ev.clientY, tx: view.tx, ty: view.ty, moved: false }; stage.classList.add('drag'); });
  window.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    view.tx = drag.tx + dx; view.ty = drag.ty + dy; apply();
  });
  window.addEventListener('pointerup', ev => {
    if (drag && !drag.moved && ev.target.closest && !ev.target.closest('g[style]')) select(null);
    drag = null; stage.classList.remove('drag');
  });
  function fit() {
    const k = Math.min((svg.clientWidth - 20) / (LEFT + 52 * W), (svg.clientHeight - 20) / totalH);
    view.k = Math.max(0.12, k); view.tx = 10; view.ty = 6; apply();
  }
  document.getElementById('fit').onclick = fit;
  window.addEventListener('resize', apply);

  // ── 걸러 보기 ──
  const edgeChips = document.getElementById('edgeChips');
  Object.entries(EDGE).forEach(([k, v]) => {
    const c = document.createElement('span'); c.className = 'chip' + (edgeOn[k] ? '' : ' off');
    c.innerHTML = `<i style="background:${v.color}"></i>${v.name}`;
    c.onclick = () => { edgeOn[k] = !edgeOn[k]; c.classList.toggle('off', !edgeOn[k]); draw(); if (selected) select(selected); };
    edgeChips.appendChild(c);
  });
  function buildLaneChips() {
    const box = document.getElementById('laneChips'); box.innerHTML = '<span class="muted">줄: </span>';
    DATA.lanes.forEach(l => {
      const c = document.createElement('span'); c.className = 'chip' + (laneOn[l.key] ? '' : ' off'); c.textContent = l.name; c.style.margin = '2px';
      c.onclick = () => { laneOn[l.key] = !laneOn[l.key]; buildLaneChips(); draw(); };
      box.appendChild(c);
    });
  }
  buildLaneChips();
  document.getElementById('pathOnly').onclick = ev => { pathOnly = !pathOnly; ev.target.textContent = '경로만: ' + (pathOnly ? '켬' : '끔'); restyle(); };
  document.getElementById('theme').onclick = () => {
    const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    r.dataset.theme = cur === 'dark' ? 'light' : 'dark'; draw();
  };

  // ── 검색 ──
  const q = document.getElementById('q');
  let hits = [], hitIdx = -1;
  q.addEventListener('input', () => {
    const s = q.value.trim().toLowerCase();
    hits = !s ? [] : DATA.nodes.filter(n => n.id.toLowerCase().includes(s) || (n.lines || []).some(l => l.toLowerCase().includes(s))
      || [...n.produces, ...n.requires, ...n.any, ...n.none].some(f => f.toLowerCase().includes(s))
      || (n.choices || []).some(c => (c.text || '').toLowerCase().includes(s)) || String(n.meta['제목'] || '').toLowerCase().includes(s)).map(n => n.id);
    hitIdx = -1; restyle(new Set(hits));
  });
  q.addEventListener('keydown', ev => { if (ev.key === 'Enter' && hits.length) { hitIdx = (hitIdx + 1) % hits.length; select(hits[hitIdx], true); restyle(new Set(hits)); } });

  // ── 점검 ──
  document.getElementById('checks').onclick = () => {
    selected = null; related = null; restyle();
    const c = DATA.checks;
    side.classList.add('open');
    side.innerHTML = `<h2>점검</h2>
      <h3>출처 없는 필요 플래그 (${c.orphans.length})</h3><p class="muted">조건에서 요구하는데 데이터·코드 어디서도 켜지 않는 플래그. 뜰 수 없는 이벤트일 수 있다.</p>
      ${c.orphans.map(o => `<div>${linkTo(o.id)} ← ${flags(o.flags)}</div>`).join('') || '<p class="muted">없음</p>'}
      <h3>켜지만 아무도 안 쓰는 플래그 (${c.unused.length})</h3><p class="muted">조건에 쓰이지 않는 플래그 (대사 안의 if·엔딩 점수 등 데이터 밖에서 쓰일 수 있음).</p>
      <div>${flags(c.unused) || '<span class="muted">없음</span>'}</div>
      <h3>대사 갈래에서만 쓰는 플래그 (${c.dialogueOnly.length})</h3><p class="muted">이벤트 조건에는 안 쓰이고 Yarn 대사의 flag("…") 갈래에서 쓰인다.</p>
      <div>${flags(c.dialogueOnly)}</div>
      <h3>코드가 켜는 것으로 보이는 플래그 (${c.codeFlags.length})</h3><p class="muted">데이터에는 출처가 없고 C# 문자열로만 나오는 플래그.</p>
      <div>${flags(c.codeFlags)}</div>`;
  };

  draw();
  fit();
})();
</script>
</body>
</html>
